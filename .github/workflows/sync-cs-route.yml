name: Synchroniser le classement sonore routier et ferroviaire

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cs-route
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le classement sonore routier et ferroviaire (WFS DDT 95)
        id: sync
        run: python3 scripts/sync-cs-route.py
      - name: Publier uniquement en cas de changement
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cs-*.geojson
          git commit -m "Actualiser le classement sonore routier et ferroviaire"
          git push
